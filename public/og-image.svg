  <text x="80" y="360" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#94a3b8">Exact lot sizing, live pip valuation &amp; risk-to-reward analysis</text>
  <text x="80" y="390" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#94a3b8">for 19 forex pairs and gold.</text>

