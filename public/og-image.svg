          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="172" y="103" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#ffffff">Von Pips FX</text>
  <text x="172" y="132" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#22d3ee" letter-spacing="2">PRO RISK · PRECISION FOREX POSITION SIZING</text>

